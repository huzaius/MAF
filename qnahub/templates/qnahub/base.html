{% load static %}
<!DOCTYPE html>
<html lang="en"> <!-- data-theme is set by inline script -->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Q&A Webapp | DaisyUI & Tailwind</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- DaisyUI CSS -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.2/dist/full.min.css" rel="stylesheet" type="text/css" />

    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
    </style>
    <script>
        // On page load, set theme from localStorage to prevent FOUC
        const theme = localStorage.getItem('theme') || 'winter';
        document.documentElement.setAttribute('data-theme', theme);
    </script>
</head>
<body class="bg-base-200">
    <div class="min-h-screen  flex flex-col ">
       <!-- Header -->
    <header class="sticky top-0 z-40 bg-base-100/80 backdrop-blur-lg shadow-sm">
        <div class="navbar container mx-auto">
            <div class="navbar-start">
                <!-- Mobile Hamburger Menu -->
                <div class="dropdown">
                    <div tabindex="0" role="button" class="btn btn-ghost lg:hidden">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h8m-8 6h16" /></svg>
                    </div>
                    <ul tabindex="0" class="menu menu-sm dropdown-content mt-3 z-[1] p-2 shadow bg-base-100 rounded-box w-52">
                         <li><a>Home</a></li>
                         <li><a>Subjects</a></li>
                         <li><a>Unanswered</a></li>
                         <li><a>All Users</a></li>
                         <div class="divider"></div>
                         <li><button class="btn btn-primary btn-sm w-full" onclick="ask_question_modal.showModal()">Ask Question</button></li>
                    </ul>
                </div>
                <!-- Title -->
                 <div class="flex items-center space-x-2">
                    <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-primary"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
                    <a href= "{% url 'qnahub-home' %}" class="text-xl md:text-2xl font-bold">Q&A HUB</a>
                </div>
            </div>
            
            <div class="navbar-center hidden lg:flex">
                 <!-- Larger Search Bar -->
                 <div class="form-control w-full max-w-2xl">
                    <label class="input input-bordered flex items-center gap-2">
                      <input type="text" class="grow" placeholder="Search" />
                      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="currentColor" class="w-4 h-4 opacity-70"><path fill-rule="evenodd" d="M9.965 11.026a5 5 0 1 1 1.06-1.06l2.755 2.754a.75.75 0 1 1-1.06 1.06l-2.755-2.754ZM10.5 7a3.5 3.5 0 1 1-7 0 3.5 3.5 0 0 1 7 0Z" clip-rule="evenodd" /></svg>
                    </label>
                </div>
            </div>

            <div class="navbar-end">
                <!-- Desktop View -->
                <div class="hidden lg:flex items-center gap-2">
                    <!-- Theme Icons -->
                    <div id="theme-icon-container" class="flex items-center gap-1 mr-2 p-1 bg-base-200 rounded-full">
                        <button title="Winter" data-theme-value="winter" class="theme-btn btn btn-sm btn-ghost btn-circle">
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
                        </button>
                        <button title="Retro" data-theme-value="retro" class="theme-btn btn btn-sm btn-ghost btn-circle">
                           <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-gamepad-2"><line x1="6" x2="10" y1="12" y2="12"></line><line x1="8" x2="8" y1="10" y2="14"></line><line x1="15" x2="15.01" y1="13" y2="13"></line><line x1="18" x2="18.01" y1="10" y2="10"></line><path d="M17.32 5H6.68a4 4 0 0 0-3.978 3.59c-.006.052-.01.101-.01.15v5.52c0 .049.004.098.01.15a4 4 0 0 0 3.978 3.59h10.64a4 4 0 0 0 3.978-3.59c.006-.052.01-.101.01-.15v-5.52c0-.049-.004-.098-.01-.15a4 4 0 0 0-3.978-3.59z"></path></svg>
                        </button>
                        <button title="Luxury" data-theme-value="luxury" class="theme-btn btn btn-sm btn-ghost btn-circle">
                           <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-gem"><path d="M6 3h12l4 6-10 13L2 9Z"></path><path d="M12 22V9"></path><path d="m3.5 8.5 17 0"></path><path d="m8 3 4 6 4-6"></path></svg>
                        </button>
                    </div>

                    <button class="btn btn-primary" onclick="ask_question_modal.showModal()">Ask Question</button>
                    
                    <!-- User Dropdown -->
                    <div class="dropdown dropdown-end">
                        <div tabindex="0" role="button" class="btn btn-ghost btn-circle avatar">
                            <div class="ring-offset-base-100 w-24 rounded-full ring-2 ring-offset-2">
                                <img alt="User Avatar" src="https://placehold.co/40x40/4f46e5/ffffff?text=U" />
                            </div>
                        </div>
                        <ul tabindex="0" class="menu menu-sm dropdown-content mt-3 z-[1] p-2 shadow bg-base-100 rounded-box w-52">
                             <li><a class="justify-between">My Account</a></li>
                            <li><a>Logout</a></li>
                        </ul>
                    </div>
                </div>
                 <!-- Mobile User Icon -->
                <div class="dropdown dropdown-end lg:hidden">
                     <div tabindex="0" role="button" class="btn btn-ghost btn-circle avatar">
                        <div class="w-10 rounded-full">
                            <img alt="User Avatar" src="https://placehold.co/40x40/4f46e5/ffffff?text=U" />
                        </div>
                    </div>
                     <ul tabindex="0" class="menu menu-sm dropdown-content mt-3 z-[1] p-2 shadow bg-base-100 rounded-box w-52">
                         <li><a class="justify-between">My Account</a></li>
                        <li><a>Logout</a></li>
                    </ul>
                </div>
            </div>
        </div>
    </header>

    <div class="container mx-auto flex flex-col md:flex-row px-4 sm:px-6 lg:px-8 mt-6 gap-8">
        <!-- Sidebar -->
        <aside class="w-full md:w-64 flex-shrink-0 hidden lg:block">
             <ul class="menu bg-base-100 rounded-box shadow-sm border border-base-300 p-2">
                <li class="menu-title">Navigation</li>
                <li><a class="active">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" /></svg>
                    Home
                </a></li>
                <li><a>
                     <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" /></svg>
                    Subjects
                </a></li>
                 <li><a>
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" /></svg>
                    Unanswered
                    <span class="badge badge-sm badge-warning">NEW</span>
                </a></li>
                 <li><a>
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M15 21a6 6 0 00-9-5.197M15 11a3 3 0 11-6 0 3 3 0 016 0z" /></svg>
                    All Users
                </a></li>
            </ul>
        </aside>

        {% block content %}

        {% endblock %}
   


    <!-- DaisyUI "Ask Question" Modal -->
    <dialog id="ask_question_modal" class="modal">
      <div class="modal-box w-11/12 max-w-2xl">
        <h3 class="font-bold text-lg">Ask a Public Question</h3>
        <div class="py-4 space-y-4">
            <label class="form-control w-full">
              <div class="label"><span class="label-text">Title</span></div>
              <input id="modal-title" type="text" placeholder="e.g. Is there a JS function to format dates?" class="input input-bordered w-full" />
            </label>
             <label class="form-control">
              <div class="label"><span class="label-text">Body</span></div>
              <textarea id="modal-body" class="textarea textarea-bordered h-24" placeholder="Include all the information someone would need to answer your question."></textarea>
            </label>
            <label class="form-control w-full">
              <div class="label"><span class="label-text">Tags</span></div>
              <input id="modal-tags" type="text" placeholder="e.g. (react javascript css)" class="input input-bordered w-full" />
            </label>
        </div>
        <div class="modal-action">
          <form id="ask-question-form" method="dialog">
            <button type="submit" class="btn btn-primary">Post Question</button>
            <button type="button" onclick="ask_question_modal.close()" class="btn">Close</button>
          </form>
        </div>
      </div>
    </dialog>
    
    <!-- Custom App JS -->
   <script  src="{% static 'qnahub/js/main.js' %}"></script>
 
    </div>
    

</body>
</html>
