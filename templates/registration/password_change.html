{% extends 'registration/auth-base.html' %}
{% block title %}Change Password{% endblock %}
{% load crispy_forms_tags %}

{% block content %}
<div class="form-container">
    <h2 class="text-3xl font-bold text-center mb-6">Change Your Password</h2>
    <form method="POST">
        {% csrf_token %}
        {{ form|crispy }}
        <button type="submit" class="btn btn-primary w-full rounded-lg text-white font-bold mt-6">Change Password</button>
    </form>
    <div class="divider my-4"></div>
    <p class="text-center text-m">
        <a href="{% url 'account' %}" class="link link-primary">Back to Account</a>
    </p>
</div>
{% endblock %}
