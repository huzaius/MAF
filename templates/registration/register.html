{% extends 'registration/auth-base.html' %}
{% load crispy_forms_tags %}

{% block content %}

<!-- Registration Form -->
<div class="form-container" id="register-form">
    <h2 class="text-3xl font-bold text-center mb-6">Create an Account</h2>
    <div class="w-full">
        <form method="POST">
            {% csrf_token %}
            {{ form|crispy }}
            <button type="submit" class="btn btn-primary w-full rounded-lg text-white font-bold mt-6">Register</button>
        </form>
        <div class="divider my-4"></div>
        <p class="text-center text-m">
            Already have an account? <a href="{% url 'login' %}" class="link link-primary">Log In</a>
        </p>
    </div>
</div>

{% endblock %}
