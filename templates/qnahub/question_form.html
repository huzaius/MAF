{% extends 'qnahub/base.html' %}
{% block title %} Ask a Question {% endblock title %}
{% load crispy_forms_tags %}
{% block content %}
<h1 class="text-4xl font-bold mb-6 text-center">Ask a Question</h1>
<form  method="POST">
    {% csrf_token %}
    <div class="form-control">
        {{form|crispy}}
        <button type="submit" class="btn btn-primary mt-4">Submit Question</button>
    </div>
</form>


{% endblock content %}
