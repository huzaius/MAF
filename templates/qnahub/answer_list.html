<div class="card bg-base-100 shadow-md {% if answer.accepted %}border border-success bg-success/10{% endif %}">
    <div class="card-body">
        <div class="flex gap-6">
            <div class="flex flex-col items-center">
                <button class="btn btn-ghost btn-sm text-lg">▲</button>
                <span class="text-xl font-bold">{{ answer.net_votes }}</span>
                <button class="btn btn-ghost btn-sm text-lg">▼</button>
                {% if answer.accepted %}<div class="mt-4 text-success tooltip" data-tip="Accepted Answer">✔️</div>{% endif %}
            </div>
            <div class="flex-1">
                <div class="prose max-w-none"><p>{{ answer.content }}</p></div>
                <div class="mt-6 flex items-center space-x-2 text-sm opacity-70">
                    <div class="w-8 rounded-full">
                                {% if answer.author.profile_picture %}
                                <img src="{{ answer.author.profile_picture.url }}" alt="{{ answer.author.name }}" />
                                {% else %}
                                <img alt="{{ answer.author.name }}" src="https://placehold.co/40x40/4f46e5/ffffff?text={{ answer.author.username|first|upper }}" />
                                {% endif %}
                            </div>  <div>
                        <div>answered by <span class="font-medium">{{ answer.author.username }}</span></div>
                        <div>{{ answer.time_ago }} ago</div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
