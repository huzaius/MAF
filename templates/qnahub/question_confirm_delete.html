{% extends "qnahub/base.html" %}
{% block title %}Confirm Delete{% endblock title %}
{% block content %}
<h1 class="text-2xl font-bold mb-4">Confirm Deletion</h1>
<p class="mb-6">Are you sure you want to delete the question titled "<strong>{{ question.title }}</strong>"?</p>
<form method="POST" action="{% url 'qnahub-question-delete' question.id %}">
    {% csrf_token %}
    <button type="submit" class="btn btn-error">Yes, Delete</button>
    <a href="{% url 'qnahub-question-detail' question.id %}" class="btn btn-ghost">Cancel</a>
</form> 
{% endblock content %}
