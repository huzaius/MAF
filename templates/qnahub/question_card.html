<a href="{% url 'qnahub-question-detail' q.id %}"
    class="card bg-base-100 shadow-md hover:shadow-lg transition-shadow cursor-pointer border border-base-300 block">

    <div class="card-body p-6">
        <div class="flex gap-6">
            <div class="flex flex-col items-center text-center w-24 flex-shrink-0">
                <div class="text-2xl font-bold">{{ q.net_votes }}</div>
                <div class="text-sm opacity-70">votes</div>
                <div class="mt-4 text-2xl font-bold">{{ q.answers.count }}</div>
                <div class="text-sm opacity-70">answers</div>
            </div>
            <div class="flex-1">
                <h2 class="card-title text-primary mb-2 hover:underline">{{ q.title }}</h2>
                <p class="opacity-80 line-clamp-2 mb-4">{{ q.content }}</p>
                <div class="card-actions justify-end items-center">
                    <div class="flex items-center space-x-2 text-sm opacity-70 mt-4">
                        <div class="avatar">
                            <div class="w-8 rounded-full">
                                {% if q.author.profile_picture %}
                                <img src="{{ q.author.profile_picture.url }}" alt="{{ q.author.name }}" />
                                {% else %}
                                <img alt="{{ q.author.name }}" src="https://placehold.co/40x40/4f46e5/ffffff?text={{ q.author.name|first|upper }}" />
                                {% endif %}
                            </div>
                        </div>
                        <span>{{ q.author.name }}</span>
                        <span>asked {{ q.timestamp|timesince }} ago</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</a>
