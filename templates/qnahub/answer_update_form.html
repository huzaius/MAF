{% extends "qnahub/base.html" %}
{% block title %}Edit Answer{% endblock title %}
{% block content %}
{% load crispy_forms_tags %}

<form  method="POST">
    {% csrf_token %}
    <div class="form-control">
        {{form|crispy}}
        <button type="submit" class="btn btn-primary mt-4">Submit Question</button>
    </div>
</form>

{% endblock content %}
